/* =====================================================================
   RARE.Qc RESOURCE INVENTORY — STYLE SHEET
   ===================================================================== */

/* ---------- 1. DESIGN TOKENS ---------- */
:root{
  --paper:        #FAF9F6;
  --surface:      #FFFFFF;
  --surface-sunk: #F1F4F3;
  --ink:          #1E2A28;
  --ink-soft:     #52625F;
  --ink-faint:    #8A9895;
  --line:         #DCE3E0;
  --line-soft:    #EBEFED;

  --teal-900:     #0F3D3E;
  --teal-700:     #1C5E5C;
  --teal-600:     #24756F;
  --teal-500:     #2E8C84;
  --teal-100:     #E1EFEC;

  --amber-600:    #C1832A;
  --amber-100:    #F6EADA;

  --clay-600:     #B4553B;
  --clay-100:     #F3E2DB;

  --ok:           #2E7D4F;
  --ok-bg:        #E6F2EA;
  --warn:         #B4553B;
  --warn-bg:      #F8E9E5;

  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 16px;

  --font-display: "Fraunces", Georgia, serif;
  --font-body: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, monospace;

  --shadow-1: 0 1px 2px rgba(15,61,62,0.06), 0 1px 1px rgba(15,61,62,0.04);
  --shadow-2: 0 6px 20px rgba(15,61,62,0.10);
}

/* ---------- 2. RESET ---------- */
*,*::before,*::after{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
body{
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
h1,h2,h3,h4{ margin:0; font-family: var(--font-display); font-weight:600; color: var(--teal-900); }
p{ margin:0 0 .6em; }
button{ font-family: inherit; cursor:pointer; }
input,select,textarea{ font-family: inherit; font-size: 14px; }
a{ color: var(--teal-600); }
:focus-visible{ outline: 2px solid var(--teal-500); outline-offset: 2px; }

/* ---------- 3. LAYOUT SHELL ---------- */
#app{ min-height:100vh; display:flex; flex-direction:column; }

.topbar{
  position:sticky; top:0; z-index:50;
  background: var(--teal-900);
  color:#EAF3F1;
  padding: 12px 22px;
  display:flex; align-items:center; gap:16px;
}
.topbar .logo-img{ height:34px; width:auto; display:block; }
.topbar .brand{ display:flex; flex-direction:column; gap:2px; }
.topbar .brand .mark{ font-family: var(--font-display); font-size:19px; letter-spacing:.2px; color:#fff; }
.topbar .brand .sub{ font-size:11.5px; color:#AFCFC9; letter-spacing:.3px; text-transform:uppercase; }
.topbar .spacer{ flex:1; }
.topbar .save-state{ font-size:12.5px; color:#BFE0DA; display:flex; align-items:center; gap:6px; }
.topbar .save-dot{ width:7px; height:7px; border-radius:50%; background:#6FCB9E; box-shadow:0 0 0 3px rgba(111,203,158,.2); }
.topbar button.ghost{
  background:transparent; border:1px solid rgba(255,255,255,.28); color:#EAF3F1;
  padding:7px 12px; border-radius: var(--radius-sm); font-size:13px;
}
.topbar button.ghost:hover{ background: rgba(255,255,255,.08); }
.topbar .lang-toggle{
  display:flex; border:1px solid rgba(255,255,255,.28); border-radius: var(--radius-sm); overflow:hidden; font-size:12.5px;
}
.topbar .lang-toggle button{ background:transparent; color:#BFE0DA; border:none; padding:6px 10px; }
.topbar .lang-toggle button.active{ background:rgba(255,255,255,.16); color:#fff; font-weight:600; }

.progress-rail{ height:4px; background: rgba(255,255,255,.15); }
.progress-fill{ height:100%; background: linear-gradient(90deg,var(--teal-500),#6FCB9E); transition: width .35s ease; }

.shell{
  flex:1; width:100%; max-width: 980px; margin: 0 auto;
  padding: 28px 20px 90px;
}

.stepper{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom: 26px; }
.stepper .step{
  font-size:12px; font-family: var(--font-mono); color: var(--ink-faint);
  border:1px solid var(--line); background:var(--surface);
  padding:5px 10px; border-radius: 999px; display:flex; gap:6px; align-items:center;
}
.stepper .step.active{ border-color: var(--teal-500); color: var(--teal-700); background: var(--teal-100); }
.stepper .step .n{ font-weight:600; }

/* ---------- 4. CARD / SECTION ---------- */
.section-card{
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  margin-bottom: 18px;
  overflow: hidden;
  box-shadow: var(--shadow-1);
}
.section-head{
  display:flex; align-items:center; gap:14px;
  padding: 18px 22px;
  cursor:pointer;
  user-select:none;
}
.section-head .idx{
  font-family: var(--font-mono); font-size:12px; color: var(--teal-600);
  background: var(--teal-100); border-radius:6px; padding:3px 8px; min-width:26px; text-align:center;
}
.section-head h2{ font-size:19px; flex:1; }
.section-head .chev{ transition: transform .2s ease; color: var(--ink-faint); }
.section-card.collapsed .chev{ transform: rotate(-90deg); }
.section-body{ padding: 4px 22px 22px; border-top:1px solid var(--line-soft); }
.section-card.collapsed .section-body{ display:none; }
.section-desc{ color: var(--ink-soft); font-size:13.5px; margin: 12px 0 18px; }

/* ---------- 5. FORM ELEMENTS ---------- */
.field{ margin-bottom: 16px; }
.field label{ display:block; font-size:13px; font-weight:600; color: var(--ink); margin-bottom:5px; }
.field .required-mark{ color: var(--clay-600); margin-left:2px; }
.field .help{ font-size:12px; color: var(--ink-faint); margin-top:4px; }
.field .error{ font-size:12px; color: var(--warn); margin-top:4px; display:none; }
.field.invalid input, .field.invalid select, .field.invalid textarea{ border-color: var(--warn); background: var(--warn-bg); }
.field.invalid .error{ display:block; }

.field input[type=text], .field input[type=email], .field input[type=url],
.field input[type=number], .field select, .field textarea{
  width:100%; padding: 9px 11px; border:1px solid var(--line); border-radius: var(--radius-sm);
  background: var(--surface); color: var(--ink);
}
.field input:focus, .field select:focus, .field textarea:focus{ border-color: var(--teal-500); }
.field textarea{ min-height:70px; resize: vertical; }
::placeholder{ font-style: italic; color: var(--ink-faint); opacity: 1; }

.grid-2{ display:grid; grid-template-columns:1fr 1fr; gap:14px 18px; }
@media (max-width: 720px){ .grid-2{ grid-template-columns:1fr; } }

.chip-group{ display:flex; flex-wrap:wrap; gap:8px; }
.chip{
  border:1px solid var(--line); background: var(--surface); color: var(--ink-soft);
  padding:8px 13px; border-radius:999px; font-size:13px; display:flex; align-items:center; gap:7px;
}
.chip input{ accent-color: var(--teal-600); }
.chip.checked{ border-color: var(--teal-500); background: var(--teal-100); color: var(--teal-900); font-weight:500; }
.chip:hover{ border-color: var(--teal-500); }

.radio-row{ display:flex; gap:10px; flex-wrap:wrap; }
.radio-row label{
  border:1px solid var(--line); border-radius: var(--radius-sm); padding:9px 14px;
  font-size:13.5px; display:flex; align-items:center; gap:8px; color:var(--ink-soft); font-weight:500;
}
.radio-row label:has(input:checked){ border-color: var(--teal-500); background: var(--teal-100); }

/* ---------- multi-entry text list (e.g. rare diseases studied) ---------- */
.multitext-row{ display:flex; gap:8px; margin-bottom:8px; }
.multitext-row input{ flex:1; }
.multitext-row .row-remove{
  background:none; border:1px solid var(--line); color: var(--warn); border-radius:6px; padding:0 10px; font-size:13px;
}
.add-line-btn{
  border: 1.5px dashed var(--teal-500); background: var(--teal-100); color: var(--teal-700);
  padding:8px 12px; border-radius: var(--radius-sm); font-weight:600; font-size:12.5px;
}
.add-line-btn:hover{ background:#D7ECE7; }

/* ---------- 6. RESOURCE TABLES (specimen-log styling: the signature motif) ---------- */
.resource-table-wrap{ border:1px solid var(--line); border-left: 5px solid var(--field-color, var(--teal-500)); border-radius: var(--radius-md); overflow:hidden; margin-bottom:14px; background:var(--surface); }
.resource-table-head{ padding:10px 14px; background: var(--surface-sunk); display:flex; align-items:center; gap:10px; }
.resource-table-head .r-tag{ font-family: var(--font-mono); font-size:11px; letter-spacing:.4px; color:#fff; background: var(--field-color, var(--teal-600)); padding:3px 8px; border-radius:5px; }
.resource-table-head .r-title{ font-weight:600; font-size:14px; flex:1; }
table.resource-table{ width:100%; border-collapse:collapse; }
table.resource-table th{ text-align:left; font-size:12px; color:var(--ink-soft); background: var(--surface-sunk); padding:8px 12px; border-bottom:1px solid var(--line); }
table.resource-table td{ border-bottom:1px solid var(--line-soft); padding:6px 8px; vertical-align:top; }
table.resource-table td.col-name{ width:30%; }
table.resource-table td.col-remove{ width:44px; text-align:center; }
table.resource-table input, table.resource-table textarea{
  width:100%; border:1px solid transparent; background:transparent; padding:7px 8px; border-radius:6px; font-size:13.5px;
}
table.resource-table input:focus, table.resource-table textarea:focus{ border-color: var(--teal-500); background:var(--surface); }
table.resource-table textarea{ min-height:40px; resize:vertical; }
table.resource-table tr.invalid-row td input, table.resource-table tr.invalid-row td textarea{ border-color: var(--warn); background: var(--warn-bg); }
.row-remove-btn{ background:none; border:1px solid var(--line); color: var(--warn); border-radius:6px; padding:5px 8px; font-size:12px; }
.row-remove-btn:hover{ background: var(--warn-bg); }
.add-row-btn{
  display:block; width:100%; border:none; border-top:1px dashed var(--line); background: var(--teal-100); color: var(--teal-700);
  padding:10px; font-weight:600; font-size:13px;
}
.add-row-btn:hover{ background:#D7ECE7; }

/* ---------- 7. BUTTONS ---------- */
.btn{ padding:10px 18px; border-radius: var(--radius-sm); font-size:14px; font-weight:600; border:1px solid transparent; }
.btn-primary{ background: var(--teal-700); color:#fff; }
.btn-primary:hover{ background: var(--teal-900); }
.btn-secondary{ background: var(--surface); color: var(--teal-700); border-color: var(--teal-500); }
.btn-secondary:hover{ background: var(--teal-100); }
.btn-danger-outline{ background: var(--surface); color: var(--clay-600); border-color: var(--clay-600); }
.btn-danger-outline:hover{ background: var(--clay-100); }
.btn-text{ background:none; color: var(--ink-soft); border:none; text-decoration:underline; }
.btn-row{ display:flex; gap:10px; justify-content:flex-end; margin-top: 18px; flex-wrap:wrap; }
.btn:disabled{ opacity:.5; cursor:not-allowed; }

/* ---------- 8. SEARCH ---------- */
.search-bar{
  display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--line);
  border-radius:999px; padding:8px 14px; margin-bottom:20px;
}
.search-bar input{ border:none; outline:none; flex:1; font-size:13.5px; background:transparent; }

/* ---------- 9. REVIEW PAGE ---------- */
.review-block{ margin-bottom: 22px; }
.review-block h3{ font-size:15px; color: var(--teal-700); border-bottom:1px solid var(--line-soft); padding-bottom:6px; margin-bottom:10px; }
.review-block .edit-link{ font-size:11.5px; font-weight:500; float:right; color: var(--teal-600); cursor:pointer; }
.kv{ display:grid; grid-template-columns: 220px 1fr; gap:6px 14px; font-size:13.5px; padding:3px 0; }
.kv .k{ color: var(--ink-faint); }
.kv .v{ color: var(--ink); }
table.review-table{ width:100%; border-collapse:collapse; margin-bottom:12px; }
table.review-table th{ text-align:left; font-size:12px; color:var(--ink-soft); background:var(--surface-sunk); padding:7px 10px; border-bottom:1px solid var(--line); }
table.review-table td{ font-size:13px; padding:7px 10px; border-bottom:1px solid var(--line-soft); }

/* ---------- 10. BANNERS / TOASTS ---------- */
.banner{ border-radius: var(--radius-md); padding:14px 16px; margin-bottom:18px; font-size:13.5px; display:flex; gap:10px; align-items:flex-start; }
.banner.info{ background: var(--teal-100); color: var(--teal-900); border:1px solid #BFE0DA; }
.banner.ok{ background: var(--ok-bg); color:#1F5C39; border:1px solid #BFE3CC; }

.toast{
  position:fixed; bottom:20px; right:20px; background: var(--teal-900); color:#fff; padding:11px 16px;
  border-radius: var(--radius-sm); font-size:13px; box-shadow: var(--shadow-2); z-index:200; opacity:0; transform: translateY(8px);
  transition: all .25s ease; pointer-events:none; max-width:340px;
}
.toast.show{ opacity:1; transform:translateY(0); }

/* ---------- 11. INTRO PANEL ---------- */
.intro-panel{
  background: var(--teal-100);
  border: 1px solid #BFE0DA;
  border-radius: var(--radius-lg);
  padding: 22px 26px;
  margin-bottom: 22px;
}
.intro-panel .intro-block{ margin-bottom: 16px; }
.intro-panel .intro-block:last-child{ margin-bottom: 0; }
.intro-panel h3{ font-size: 15px; color: var(--teal-900); margin-bottom: 6px; }
.intro-panel p{ font-size: 13.5px; color: var(--ink-soft); margin: 0; line-height: 1.6; }

/* ---------- 12. UTIL ---------- */
.hidden{ display:none !important; }
.small{ font-size:12px; }
.muted{ color: var(--ink-faint); }
</style>

function freshState(){
  return {
    general: {},
    fields: [],
    sharing: { willing: "", accessConditions: [], comments: "" },
    humanBiospecimen: { has: "", entries: [] },
    resources: {},
    ui: { collapsed: {}, search: "", currentReview: false, lang: "en" },
    submitted: false
  };
}
let STATE = freshState();

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){ STATE = Object.assign(STATE, JSON.parse(raw)); if(!STATE.ui.lang) STATE.ui.lang = "en"; return true; }
  }catch(e){ console.warn("State load failed.", e); }
  return false;
}
function saveState(showToast){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE));
  const dot = document.getElementById("saveDot");
  if(dot) dot.style.background = "#6FCB9E";
  const label = document.getElementById("saveLabel");
  if(label) label.textContent = t("savedAt") + " " + new Date().toLocaleTimeString();
  if(showToast) toast(t("toastProgressSaved"));
}
let autosaveTimer = null;
function scheduleAutosave(){ clearTimeout(autosaveTimer); autosaveTimer = setTimeout(()=> saveState(false), AUTOSAVE_MS); }
function resourceId(){ return "r_" + Math.random().toString(36).slice(2,10); }

function resetSurvey(){
  if(!window.confirm(t("resetConfirm"))) return;
  const keepLang = STATE.ui.lang;
  localStorage.removeItem(STORAGE_KEY);
  STATE = freshState();
  STATE.ui.lang = keepLang;
  renderApp();
  toast(t("resetDone"));
}

/* ================== PART C — VALIDATION ENGINE ======================= */
function testPattern(key, value){
  const p = CONFIG.validationPatterns[key];
  if(!p) return true;
  try{ return new RegExp(p.regex).test(value); }catch(e){ return true; }
}

function validateGeneral(){
  let ok = true;
  CONFIG.generalFields.forEach(f=>{
    if(f.type === "multitext") return;
    const val = (STATE.general[f.id] || "").trim();
    let fieldOk = true;
    if(f.required && !val) fieldOk = false;
    if(val && f.type === "email" && !testPattern("email", val)) fieldOk = false;
    if(val && f.type === "url" && !testPattern("url", val)) fieldOk = false;
    setFieldValidity("gen_" + f.id, fieldOk);
    if(!fieldOk) ok = false;
  });
  return ok;
}

function validateHumanBiospecimen(){
  let ok = true;
  if(STATE.humanBiospecimen.has === "yes"){
    STATE.humanBiospecimen.entries.forEach(entry=>{
      const rowEl = document.querySelector('[data-rowkey="'+CSS.escape(entry.id)+'"]');
      let rowOk = true;
      CONFIG.humanBiospecimen.columns.forEach(col=>{
        if(col.required && !(entry.values[col.id]||"").trim()) rowOk = false;
      });
      if(rowEl) rowEl.classList.toggle("invalid-row", !rowOk);
      if(!rowOk) ok = false;
    });
  }
  return ok;
}

function validateResources(){
  let ok = true;
  STATE.fields.forEach(fieldId=>{
    (STATE.resources[fieldId] || []).forEach(res=>{
      let rowOk = true;
      CONFIG.resourceEntryColumns.forEach(col=>{
        if(col.required && !(res.values[col.id]||"").trim()) rowOk = false;
      });
      const rowEl = document.querySelector('[data-rowkey="'+CSS.escape(res.id)+'"]');
      if(rowEl) rowEl.classList.toggle("invalid-row", !rowOk);
      if(!rowOk) ok = false;
    });
  });
  return ok;
}

function setFieldValidity(fieldKey, isValid){
  const el = document.querySelector('[data-fieldkey="'+CSS.escape(fieldKey)+'"]');
  if(!el) return;
  el.classList.toggle("invalid", !isValid);
}

/* ================== PART D — RENDER ENGINE =========================== */

/* ---- i18n helpers ----
   IMPORTANT: these helpers only affect what's DISPLAYED on screen.
   CONFIG itself (the English labels) is left untouched, and the export
   functions in PART E deliberately keep reading straight from CONFIG —
   so the Excel file, the emailed data, and the Google Sheet rows always
   come out the same regardless of which language the researcher used
   to fill in the survey. */
function t(key){
  const dict = UI_STRINGS[STATE.ui.lang] || UI_STRINGS.en;
  return (dict && dict[key] !== undefined) ? dict[key] : (UI_STRINGS.en[key] !== undefined ? UI_STRINGS.en[key] : key);
}
function isFr(){ return STATE.ui.lang === "fr"; }

function trGeneralLabel(f){ const fr = GENERAL_FIELDS_FR[f.id]; return (isFr() && fr && fr.label) ? fr.label : f.label; }
function trGeneralHelp(f){ const fr = GENERAL_FIELDS_FR[f.id]; if(isFr() && fr && fr.help) return fr.help; return f.help || ""; }
function trGeneralPlaceholder(f){ const fr = GENERAL_FIELDS_FR[f.id]; if(isFr() && fr && fr.placeholder) return fr.placeholder; return f.placeholder || ""; }
function trGeneralAddButtonLabel(f){
  const fr = GENERAL_FIELDS_FR[f.id];
  if(isFr() && fr && fr.addButtonLabel) return fr.addButtonLabel;
  return f.addButtonLabel || t("addAnotherDisease");
}

function trFieldMetaLabel(meta){
  if(!meta) return "";
  if(isFr() && RESEARCH_FIELDS_FR[meta.id]) return RESEARCH_FIELDS_FR[meta.id];
  return meta.label;
}
function trSharingLabel(opt){ if(isFr() && SHARING_OPTIONS_FR[opt.id]) return SHARING_OPTIONS_FR[opt.id]; return opt.label; }
function trAccessLabel(c){ if(isFr() && ACCESS_CONDITIONS_FR[c.id]) return ACCESS_CONDITIONS_FR[c.id]; return c.label; }

function trHumanBioQuestion(){ return isFr() ? HUMAN_BIOSPECIMEN_FR.question : CONFIG.humanBiospecimen.question; }
function trHumanBioColLabel(col){
  if(isFr() && HUMAN_BIOSPECIMEN_FR.columns[col.id]) return HUMAN_BIOSPECIMEN_FR.columns[col.id];
  return col.label;
}
const HUMAN_BIO_EXAMPLES_EN = {
  name: "e.g. SETBP1-/- patient line 1",
  type: "e.g. skin biopsy, whole blood, tumor tissue",
  specs: "e.g. formalin-fixed paraffin-embedded, linked to clinical data",
  storage: "e.g. location within institution"
};
function trHumanBioExample(colId){
  if(isFr() && HUMAN_BIOSPECIMEN_FR.examples[colId]) return HUMAN_BIOSPECIMEN_FR.examples[colId];
  return HUMAN_BIO_EXAMPLES_EN[colId] || "";
}

function trResourceColLabel(col){
  if(isFr() && RESOURCE_ENTRY_COLUMNS_FR[col.id]) return RESOURCE_ENTRY_COLUMNS_FR[col.id];
  return col.label;
}

function trCategoryLabel(cat){ if(isFr() && CATEGORY_FR[cat]) return CATEGORY_FR[cat]; return cat; }
function trGroupLabel(group){ if(isFr() && GROUP_LABELS_FR[group]) return GROUP_LABELS_FR[group]; return group; }
function trFieldSubtitle(meta){
  if(!meta || !meta.subtitle) return "";
  if(isFr() && FIELD_SUBTITLES_FR[meta.id]) return FIELD_SUBTITLES_FR[meta.id];
  return meta.subtitle;
}
function isGroupedCategories(structure){
  return Array.isArray(structure) && structure.length > 0 && typeof structure[0] === "object" && structure[0] !== null && "group" in structure[0];
}

function pluralEntries(n){ return n + " " + (n === 1 ? t("entrySingular") : t("entryPlural")); }

/* ---- core lookups (unchanged canonical data, English) ---- */
function getCategoriesForField(fieldId){ return CONFIG.resourceCategories[fieldId] || CONFIG.genericCategories; }
function getFieldMeta(fieldId){ return CONFIG.researchFields.find(f=>f.id===fieldId); }
function getCategoryExample(category){
  if(isFr()){
    return CATEGORY_EXAMPLES_FR[category] || CATEGORY_EXAMPLES_FR["Other"] ||
      CONFIG.categoryExamples[category] || CONFIG.categoryExamples["Other"];
  }
  return CONFIG.categoryExamples[category] || CONFIG.categoryExamples["Other"] || { name:"resource or technique name", specs:"brief description" };
}
function fmtDate(d){ return d.toISOString().slice(0,10); }
function fmtDateTime(d){
  const pad = n => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()) +
    " " + pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds());
}

function el(tag, attrs, children){
  const node = document.createElement(tag);
  attrs = attrs || {};
  Object.keys(attrs).forEach(k=>{
    if(k === "class") node.className = attrs[k];
    else if(k === "html") node.innerHTML = attrs[k];
    else if(k.startsWith("on")) node.addEventListener(k.slice(2), attrs[k]);
    else node.setAttribute(k, attrs[k]);
  });
  (children||[]).forEach(c=>{ if(c) node.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
  return node;
}

function toast(msg){
  const tEl = document.getElementById("toast");
  tEl.textContent = msg;
  tEl.classList.add("show");
  clearTimeout(tEl._timer);
  tEl._timer = setTimeout(()=> tEl.classList.remove("show"), 3200);
}

function computeProgress(){
  let total = 0, done = 0;
  CONFIG.generalFields.forEach(f=>{
    total++;
    if(f.type === "multitext"){ if((STATE.general[f.id]||[]).some(v=>v && v.trim())) done++; }
    else if((STATE.general[f.id]||"").trim()) done++;
  });
  total++; if(STATE.fields.length) done++;
  total++; if(STATE.sharing.willing) done++;
  total++; if(STATE.humanBiospecimen.has) done++;
  if(STATE.fields.length){
    total++; if(STATE.fields.some(fid => (STATE.resources[fid]||[]).length>0)) done++;
  }
  return Math.round((done/total)*100);
}

function renderApp(){
  document.documentElement.lang = STATE.ui.lang;
  const root = document.getElementById("app");
  root.innerHTML = "";
  root.appendChild(renderTopbar());
  const rail = el("div",{class:"progress-rail"});
  rail.appendChild(el("div",{class:"progress-fill", style:"width:"+computeProgress()+"%"}));
  root.appendChild(rail);

  const shell = el("div",{class:"shell"});
  root.appendChild(shell);

  if(STATE.ui.currentReview){
    shell.appendChild(renderStepper(true));
    shell.appendChild(renderReview());
    return;
  }

  shell.appendChild(renderIntroSection());
  shell.appendChild(renderStepper(false));
  shell.appendChild(renderSearchBar());
  if(STATE.submitted) shell.appendChild(renderSubmittedBanner());

  shell.appendChild(renderGeneralSection());
  shell.appendChild(renderFieldSection());
  shell.appendChild(renderSharingSection());
  shell.appendChild(renderHumanBiospecimenSection());
  STATE.fields.forEach(fid => shell.appendChild(renderFieldResourceSection(fid)));

  const btnRow = el("div",{class:"btn-row"});
  btnRow.appendChild(el("button",{class:"btn btn-danger-outline", onclick: resetSurvey},[t("resetBtn")]));
  btnRow.appendChild(el("button",{class:"btn btn-secondary", onclick: ()=>{ saveState(true); }},[t("saveProgress")]));
  btnRow.appendChild(el("button",{class:"btn btn-primary", onclick: goToReview},[t("continueToReview")]));
  shell.appendChild(btnRow);
}

function renderTopbar(){
  const bar = el("div",{class:"topbar"});
  const img = el("img",{class:"logo-img", src: LOGO_DATA_URI, alt: "RARE.Qc"});

function renderCategoryChip(fieldId, cat, activeCats){
  const checked = activeCats.has(cat);
  const catLabel = trCategoryLabel(cat);
  const chip = el("label",{class:"chip"+(checked?" checked":""), "data-searchable": catLabel});
  const input = el("input",{type:"checkbox"});

  input.addEventListener("change", ()=>{

    if(input.checked){
      STATE.resources[fieldId].push({ id: resourceId(), category: cat, values:{ name:"", specs:"" } });
    } else {
      STATE.resources[fieldId] = STATE.resources[fieldId].filter(r=>r.category!==cat);

    scheduleAutosave(); renderApp();
  });

  chip.appendChild(el("span",{},[catLabel]));

function renderFieldResourceSection(fieldId){
  const meta = getFieldMeta(fieldId);
  const label = trFieldMetaLabel(meta);
  let desc = t("resourceSectionDescTemplate").replace("{field}", label);
  const subtitle = trFieldSubtitle(meta);
  if(subtitle) desc = "(" + subtitle + ") " + desc;
  const card = sectionShell("R", label + t("resourceSectionSuffix"), desc, "res_" + fieldId);
  card.style.setProperty("--field-color", meta.color);
  const body = card.querySelector(".section-body");

  const structure = getCategoriesForField(fieldId);
  const activeCats = new Set((STATE.resources[fieldId]||[]).map(r=>r.category));

  if(isGroupedCategories(structure)){
    structure.forEach(groupObj=>{
      const groupWrap = el("div",{style:"margin-bottom:6px;"});
      groupWrap.appendChild(el("h4",{style:"font-size:13px;color:var(--teal-700);margin:14px 0 8px;"},[trGroupLabel(groupObj.group)]));
      const group = el("div",{class:"chip-group"});
      groupObj.items.forEach(cat=> group.appendChild(renderCategoryChip(fieldId, cat, activeCats)));
      groupWrap.appendChild(group);
      body.appendChild(groupWrap);
    });
  } else {
    const group = el("div",{class:"chip-group"});
    structure.forEach(cat=> group.appendChild(renderCategoryChip(fieldId, cat, activeCats)));
    body.appendChild(group);
  }

  const byCat = {};
  (STATE.resources[fieldId]||[]).forEach(r=>{ (byCat[r.category] = byCat[r.category]||[]).push(r); });

  Object.keys(byCat).forEach(cat=>{
    body.appendChild(renderResourceTable(fieldId, cat, byCat[cat], meta.color));

  return card;

/* ---- generic single-line/textarea/select field renderer (general info) ---- */
function renderTextField(f, key, value, onChange){
  const wrap = el("div",{class:"field", "data-fieldkey": key});
  const labelRow = el("label",{},[trGeneralLabel(f)]);
  if(f.required) labelRow.appendChild(el("span",{class:"required-mark"},["*"]));
  wrap.appendChild(labelRow);

  let input;
  if(f.type === "textarea"){
    input = el("textarea",{}); input.value = value;
  } else if(f.type === "select"){
    input = el("select",{});
    input.appendChild(el("option",{value:""},["Select…"]));
    (f.options||[]).forEach(o=>{
      const opt = el("option",{value:o},[o]);
      if(value===o) opt.selected = true;
      input.appendChild(opt);
    });
  } else {
    input = el("input",{type: f.type==="url" ? "url" : (f.type==="email" ? "email":"text")});
    input.value = value;
  }
  input.addEventListener("input", (e)=>{ onChange(e.target.value); });
  input.addEventListener("change", (e)=>{ onChange(e.target.value); });
  wrap.appendChild(input);

  const help = trGeneralHelp(f);
  if(help) wrap.appendChild(el("div",{class:"help"},[help]));
  let errMsg = t("fieldRequired");
  if(f.type==="email") errMsg = t("invalidEmail");
  if(f.type==="url") errMsg = t("invalidUrl");
  wrap.appendChild(el("div",{class:"error"},[errMsg]));
  return wrap;
}

/* ================== PART E — SUBMIT: EXCEL EXPORT + EMAIL + SHEET =====
   These functions deliberately read English labels straight from CONFIG
   (not the translation helpers above) so the Excel file, email body,
   and Google Sheet rows come out identically regardless of which
   language the researcher used to fill in the survey.
   ===================================================================== */
function buildWorkbook(){
  const wb = XLSX.utils.book_new();

  const generalRows = [["Field","Value"]];
  CONFIG.generalFields.forEach(f=>{
    let val = "";
    if(f.type === "multitext") val = (STATE.general[f.id]||[]).filter(v=>v&&v.trim()).join("; ");
    else val = STATE.general[f.id] || "";
    generalRows.push([f.label, val]);
  });
  const fieldOpt = CONFIG.sharingOptions.find(o=>o.id===STATE.sharing.willing);
  generalRows.push(["Willing to share resources", fieldOpt ? fieldOpt.label : ""]);
  generalRows.push(["Access conditions", STATE.sharing.accessConditions.map(id=>CONFIG.accessConditions.find(c=>c.id===id)?.label).join("; ")]);
  generalRows.push(["Sharing comments", STATE.sharing.comments || ""]);
  generalRows.push(["Research fields selected", STATE.fields.map(id=>getFieldMeta(id)?.label).join("; ")]);
  generalRows.push(["Submission date", fmtDateTime(new Date())]);
  const wsGeneral = XLSX.utils.aoa_to_sheet(generalRows);
  XLSX.utils.book_append_sheet(wb, wsGeneral, "General Info");

  if(STATE.humanBiospecimen.has === "yes" && STATE.humanBiospecimen.entries.length){
    const bioRows = STATE.humanBiospecimen.entries.map(entry=>{
      const row = {};
      CONFIG.humanBiospecimen.columns.forEach(c=>{ row[c.label] = entry.values[c.id] || ""; });
      return row;
    });
    const wsBio = XLSX.utils.json_to_sheet(bioRows);
    XLSX.utils.book_append_sheet(wb, wsBio, "Human Biospecimens");
  }

  const resourceRows = [];
  STATE.fields.forEach(fieldId=>{
    (STATE.resources[fieldId]||[]).forEach(res=>{
      const row = { "Research Field": getFieldMeta(fieldId)?.label || fieldId, "Resource Category": res.category };
      CONFIG.resourceEntryColumns.forEach(c=>{ row[c.label] = res.values[c.id] || ""; });
      resourceRows.push(row);
    });
  });
  const wsResources = resourceRows.length
    ? XLSX.utils.json_to_sheet(resourceRows)
    : XLSX.utils.aoa_to_sheet([["Research Field","Resource Category"].concat(CONFIG.resourceEntryColumns.map(c=>c.label))]);
  XLSX.utils.book_append_sheet(wb, wsResources, "Resources");

  return wb;
}

function safeFileToken(s){
  return (s||"lab").toString().trim().replace(/[^a-z0-9]+/gi,"_").slice(0,40) || "lab";
}

function buildSheetRows(){
  const rows = [];
  const submissionDateTime = fmtDateTime(new Date());
  const rareDiseases = (STATE.general.rareDiseases||[]).filter(v=>v&&v.trim()).join("; ");
  const baseInfo = [
    submissionDateTime,
    STATE.general.labName || "",
    STATE.general.pi || "",
    STATE.general.contact || "",
    STATE.general.contactEmail || "",
    STATE.general.site || "",
    rareDiseases
  ];

  STATE.fields.forEach(fieldId=>{
    const fieldLabel = getFieldMeta(fieldId)?.label || fieldId;
    (STATE.resources[fieldId]||[]).forEach(res=>{
      rows.push([
        ...baseInfo,
        fieldLabel,
        res.category,
        res.values.name || "",
        res.values.specs || "",
        "",
        ""
      ]);
    });
  });

  if(STATE.humanBiospecimen.has === "yes"){
    STATE.humanBiospecimen.entries.forEach(entry=>{
      rows.push([
        ...baseInfo,
        "Human Biospecimens",
        "Human Biospecimen",
        entry.values.name || "",
        entry.values.specs || "",
        entry.values.type || "",
        entry.values.storage || ""
      ]);
    });
  }

  return rows;
}

async function submitSurvey(){
  if(typeof XLSX === "undefined"){
    toast(t("toastNoLibrary"));
    return;
  }

  const submitBtn = document.querySelector(".btn-primary");
  if(submitBtn){ submitBtn.disabled = true; submitBtn.textContent = t("submitting"); }

  try{
    const wb = buildWorkbook();
    const filename = "RAREQc_Inventory_" + safeFileToken(STATE.general.labName) + "_" + fmtDate(new Date()) + ".xlsx";

    const fileBase64 = XLSX.write(wb, { bookType: "xlsx", type: "base64" });

    const resourceCount = STATE.fields.reduce((sum,fid)=> sum + (STATE.resources[fid]||[]).length, 0)
      + (STATE.humanBiospecimen.has === "yes" ? STATE.humanBiospecimen.entries.length : 0);

    const payload = {
      labName: STATE.general.labName || "",
      pi: STATE.general.pi || "",
      contactPerson: STATE.general.contact || "",
      resourceCount: resourceCount,
      submissionDate: fmtDateTime(new Date()),
      fileName: filename,
      fileBase64: fileBase64,
      sheetRows: buildSheetRows()
    };

    const response = await fetch(SUBMISSION_ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });

    if(!response.ok){
      throw new Error("Server responded with status " + response.status);
    }

    STATE.submitted = true;
    STATE.submittedAt = new Date().toISOString();
    saveState(false);

    toast(t("toastSubmitSuccess"));
    STATE.ui.currentReview = false;
    renderApp();
    window.scrollTo(0,0);

  }catch(err){
    console.error("Submission failed:", err);
    toast(t("toastSubmitFail"));
    if(submitBtn){ submitBtn.disabled = false; submitBtn.textContent = t("submitInventory"); }
  }
}

/* ================== PART F — BOOTSTRAP ================================ */
function init(){
  const hadSaved = loadState();
  renderApp();
  if(hadSaved) toast(t("toastResumed"));
  setInterval(()=> saveState(false), 15000);
}
document.addEventListener("DOMContentLoaded", init);

</script>
